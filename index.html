<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Quran Circle - حلقة القرآن</title>
    <meta name="title" content="Quran Circle - حلقة القرآن" />
    <meta name="description" content="A distraction-free platform for reading, memorizing, and completing the Quran through personal tracking and anonymous circle goals" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://qurancircle.net/" />
    <meta property="og:title" content="Quran Circle - حلقة القرآن" />
    <meta property="og:description" content="A distraction-free platform for reading, memorizing, and completing the Quran through personal tracking and anonymous circle goals" />
    <meta property="og:image" content="https://qurancircle.net/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:site_name" content="Quran Circle" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://qurancircle.net/" />
    <meta property="twitter:title" content="Quran Circle - حلقة القرآن" />
    <meta property="twitter:description" content="A distraction-free platform for reading, memorizing, and completing the Quran through personal tracking and anonymous circle goals" />
    <meta property="twitter:image" content="https://qurancircle.net/og-image.png" />
    
    <!-- Article metadata (helps with publish date) -->
    <meta property="article:published_time" content="2024-01-01T00:00:00Z" />
    <meta property="article:author" content="Quran Circle" />
    
    <!-- PWA -->
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Quran Circle" />
    
    <!-- Additional Meta -->
    <meta name="robots" content="index, follow" />
    <meta name="language" content="English" />
    <meta name="author" content="Quran Circle" />
  </head>
  <body>
    <div id="root">
      <!-- Loading screen that shows while app initializes -->
      <div id="initial-loader" style="display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); font-family: system-ui, -apple-system, sans-serif;">
        <div style="text-align: center;">
          <!-- Logo placeholder -->
          <div style="width: 80px; height: 80px; margin: 0 auto 24px; background: white; border-radius: 20px; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#667eea" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 17L12 22L22 17" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              <path d="M2 12L12 17L22 12" stroke="#667eea" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </div>
          
          <h1 style="color: white; font-size: 28px; font-weight: 700; margin: 0 0 8px 0;">Quran Circle</h1>
          <p style="color: rgba(255,255,255,0.9); font-size: 20px; margin: 0 0 32px 0;">حلقة القرآن</p>
          
          <!-- Loading spinner -->
          <div style="width: 40px; height: 40px; margin: 0 auto; border: 4px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 1s linear infinite;"></div>
          
          <!-- Timeout message (shown after 10 seconds) -->
          <div id="timeout-message" style="display: none; margin-top: 32px; padding: 20px; background: rgba(255,255,255,0.1); border-radius: 8px; max-width: 400px;">
            <p style="color: white; margin: 0 0 16px 0;">Taking longer than expected...</p>
            <button onclick="window.location.reload()" style="background: white; color: #667eea; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; margin-right: 8px;">Refresh Page</button>
            <a href="/status.html" style="color: white; text-decoration: underline;">Check Status</a>
          </div>
        </div>
      </div>
      
      <style>
        @keyframes spin {
          to { transform: rotate(360deg); }
        }
      </style>
      
      <script>
        // Show timeout message after 10 seconds if app hasn't loaded
        setTimeout(() => {
          const loader = document.getElementById('initial-loader');
          const timeoutMsg = document.getElementById('timeout-message');
          if (loader && timeoutMsg && loader.style.display !== 'none') {
            timeoutMsg.style.display = 'block';
            console.error('App load timeout - React may have failed to initialize');
          }
        }, 10000);
        
        // Remove loader when React mounts
        window.addEventListener('DOMContentLoaded', () => {
          // React will replace the content, but this ensures cleanup
          setTimeout(() => {
            const loader = document.getElementById('initial-loader');
            if (loader && loader.parentElement) {
              // Only remove if React successfully mounted (check for React root)
              const hasReactRoot = document.querySelector('[data-reactroot], [data-reactid]') || 
                                  document.querySelector('#root > :not(#initial-loader)');
              if (hasReactRoot) {
                loader.remove();
              }
            }
          }, 100);
        });
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
