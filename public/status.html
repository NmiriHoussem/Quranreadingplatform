<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quran Circle - Status Check</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
    }
    .container {
      background: white;
      border-radius: 12px;
      padding: 32px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }
    h1 {
      color: #667eea;
      margin-bottom: 24px;
    }
    .status {
      padding: 16px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .success {
      background: #d4edda;
      color: #155724;
      border: 1px solid #c3e6cb;
    }
    .error {
      background: #f8d7da;
      color: #721c24;
      border: 1px solid #f5c6cb;
    }
    .info {
      background: #d1ecf1;
      color: #0c5460;
      border: 1px solid #bee5eb;
    }
    .test-item {
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 6px;
    }
    button {
      background: #667eea;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 16px;
      margin-top: 16px;
    }
    button:hover {
      background: #5568d3;
    }
    pre {
      background: #f5f5f5;
      padding: 12px;
      border-radius: 4px;
      overflow-x: auto;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🕌 Quran Circle - System Status</h1>
    
    <div class="status success">
      ✅ <strong>Static HTML Working:</strong> This page loaded successfully, so Vercel is serving files.
    </div>

    <div class="info">
      <strong>Quick Tests:</strong>
      <div id="tests"></div>
    </div>

    <button onclick="runTests()">Run Diagnostics</button>
    <button onclick="window.location.href='/'">Go to App</button>
    <button onclick="clearCache()">Clear Cache & Reload</button>

    <div id="results" style="margin-top: 24px;"></div>
  </div>

  <script>
    async function runTests() {
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '<div class="info">Running tests...</div>';
      
      const results = [];

      // Test 1: Check if index.html exists
      try {
        const response = await fetch('/');
        results.push({
          test: 'Index.html accessible',
          status: response.ok ? 'success' : 'error',
          message: response.ok ? 'index.html loads correctly' : `Status: ${response.status}`
        });
      } catch (error) {
        results.push({
          test: 'Index.html accessible',
          status: 'error',
          message: error.message
        });
      }

      // Test 2: Check if service worker exists
      try {
        const response = await fetch('/sw.js');
        results.push({
          test: 'Service Worker file',
          status: response.ok ? 'success' : 'error',
          message: response.ok ? 'sw.js exists' : 'Service worker not found (this is OK)'
        });
      } catch (error) {
        results.push({
          test: 'Service Worker file',
          status: 'info',
          message: 'Service worker not found (this is OK)'
        });
      }

      // Test 3: Check Supabase connection
      try {
        const supabaseUrl = 'https://sxtdsxaibifgvtyeatzl.supabase.co';
        const response = await fetch(`${supabaseUrl}/rest/v1/`, {
          method: 'HEAD'
        });
        results.push({
          test: 'Supabase connection',
          status: response.ok ? 'success' : 'error',
          message: response.ok ? 'Supabase is reachable' : `Status: ${response.status}`
        });
      } catch (error) {
        results.push({
          test: 'Supabase connection',
          status: 'error',
          message: error.message
        });
      }

      // Test 4: Check localStorage
      try {
        localStorage.setItem('test', 'test');
        localStorage.removeItem('test');
        results.push({
          test: 'LocalStorage',
          status: 'success',
          message: 'localStorage is working'
        });
      } catch (error) {
        results.push({
          test: 'LocalStorage',
          status: 'error',
          message: error.message
        });
      }

      // Test 5: Service Worker registration
      if ('serviceWorker' in navigator) {
        try {
          const registrations = await navigator.serviceWorker.getRegistrations();
          results.push({
            test: 'Service Workers registered',
            status: registrations.length > 0 ? 'success' : 'info',
            message: registrations.length > 0 ? 
              `${registrations.length} service worker(s) registered` : 
              'No service workers (app needs to load first)'
          });
        } catch (error) {
          results.push({
            test: 'Service Workers registered',
            status: 'error',
            message: error.message
          });
        }
      }

      // Display results
      let html = '<h3>Test Results:</h3>';
      results.forEach(result => {
        const statusClass = result.status === 'success' ? 'success' : 
                           result.status === 'error' ? 'error' : 'info';
        html += `
          <div class="test-item">
            <strong>${result.test}:</strong><br>
            <span class="${statusClass}">${result.message}</span>
          </div>
        `;
      });

      // Add environment info
      html += '<h3>Environment Info:</h3>';
      html += `<pre>${JSON.stringify({
        userAgent: navigator.userAgent,
        language: navigator.language,
        online: navigator.onLine,
        cookieEnabled: navigator.cookieEnabled,
        serviceWorkerSupported: 'serviceWorker' in navigator,
        pathname: window.location.pathname,
        origin: window.location.origin
      }, null, 2)}</pre>`;

      resultsDiv.innerHTML = html;
    }

    async function clearCache() {
      try {
        // Clear service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          for (const registration of registrations) {
            await registration.unregister();
          }
        }

        // Clear caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          await Promise.all(
            cacheNames.map(cacheName => caches.delete(cacheName))
          );
        }

        alert('Cache cleared! The page will now reload.');
        window.location.reload(true);
      } catch (error) {
        alert('Error clearing cache: ' + error.message);
      }
    }

    // Auto-run tests on load
    window.addEventListener('load', () => {
      const testsDiv = document.getElementById('tests');
      testsDiv.innerHTML = `
        <div class="test-item">
          <strong>Browser:</strong> ${navigator.userAgent.split(' ').pop()}<br>
          <strong>Online:</strong> ${navigator.onLine ? 'Yes ✅' : 'No ❌'}<br>
          <strong>Service Worker Support:</strong> ${'serviceWorker' in navigator ? 'Yes ✅' : 'No ❌'}
        </div>
      `;
    });
  </script>
</body>
</html>
